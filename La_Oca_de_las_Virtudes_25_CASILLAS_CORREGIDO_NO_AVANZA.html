/* Mantiene el tablero y los controles en columnas independientes. */
.editor-layout {
  grid-template-columns: minmax(0, 1fr) minmax(310px, 350px);
  align-items: start;
}

.editor-board,
.editor-form,
.editor-grid,
.edit-tile {
  min-width: 0;
}

.editor-grid {
  grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
  align-content: start;
}

.edit-tile {
  overflow: hidden;
}

.editor-form {
  position: sticky;
  top: 18px;
  z-index: 2;
  overflow: hidden;
}

.editor-form input[type="file"] {
  display: block;
  width: 100%;
  max-width: 100%;
  margin: 10px 0 4px;
  font-size: .78rem;
}

@media (max-width: 1050px) {
  .editor-layout { grid-template-columns: 1fr; }
  .editor-form { position: static; width: 100%; }
  .editor-grid { grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); }
}

@media (max-width: 600px) {
  .editor-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

.editor-divider { height: 1px; background: #dbe3ea; margin: 22px 0 16px; }
.editor-form { max-height: calc(100vh - 36px); overflow-y: auto; overflow-x: hidden; }
.question-editor textarea { margin-bottom: 6px; }
.option-edit { display: grid; grid-template-columns: 20px 26px minmax(0, 1fr); align-items: center; gap: 7px; margin: 8px 0; cursor: pointer; }
.option-edit > span { width: 25px; height: 25px; border-radius: 7px; display: grid; place-items: center; background: #e9f4f2; color: #177d6e; font-size: .75rem; font-weight: 800; }
.option-edit input[type="radio"] { accent-color: #3ca89a; width: 16px; height: 16px; margin: 0; }
.option-input { min-width: 0; width: 100%; border: 2px solid #dbe0e7; border-radius: 10px; padding: 9px; outline: none; font: inherit; font-size: .83rem; }
.option-input:focus { border-color: #3ca89a; }

function render(){const kinds=boardKinds();let visual=[];for(let r=0;r<5;r++){let row=kinds.slice(r*5,r*5+5);if(r%2)row.reverse();visual.push(...row.map((k,j)=>({k,n:r*5+(r%2?4-j:j)+1})));}app.innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><div class="eyebrow">Misión de aprendizaje</div><h1>La Oca de las Virtudes</h1></div></div><div style="display:flex;gap:8px"><button class="icon-btn" onclick="toggleSound()">${state.sound?'🔊 Sonido ON':'🔇 Sonido OFF'}</button><button class="icon-btn" onclick="teacher()">🔒 Modo docente</button></div></header><section class="game-layout"><div class="board-wrap"><div class="board">${visual.map(x=>`<div class="tile ${x.k==='start'?'start':''} ${x.k==='goal'?'goal':''}" data-kind="${x.k}"><span class="num">${x.n===1?'INICIO':x.n===25?'META':String(x.n).padStart(2,'0')}</span><span class="symbol">${x.k==='goal'?'🏆':x.k==='start'?'⌁':ICON[x.k]}</span>${state.pos===x.n?`<span class="player-token" title="${state.name}">${state.avatar}</span>`:''}</div>`).join('')}</div><div class="legend"><span style="--c:#3ca89a">Teologales</span><span style="--c:#3975c4">Cardinales</span><span style="--c:#7166bb">Morales</span><span style="--c:#ef9a68">Desafío</span><span style="--c:#f2bd52">Bíblica</span><span style="--c:#ef7765">Bonus</span></div></div><aside class="side"><section class="panel"><div class="stat-grid"><div class="stat"><span>Puntos</span><b>${state.points}</b></div><div class="stat"><span>Posición</span><b>${state.pos||1}<small>/25</small></b></div><div class="stat"><span>Vidas</span><div class="lives">${'♥'.repeat(state.lives)}${'♡'.repeat(3-state.lives)}</div></div><div class="stat"><span>Aciertos</span><b>${state.correct}</b></div></div></section><section class="panel"><h2 class="turn-title">Tu siguiente paso</h2><p class="turn-copy">${state.rolling?'El dado está girando…':'Lanza el dado y demuestra lo que sabes.'}</p><div class="die ${state.rolling?'rolling':''}">${state.r function takeQuestion(kind){let choices=QUESTIONS.filter(q=>(kind==='desafio'?q.dificultad==='vivir':q.categoria===kind)&&!state.used.includes(q.id));if(!choices.length)choices=QUESTIONS.filter(q=>kind==='desafio'?q.dificultad==='vivir':q.categoria===kind);let q=choices[Math.floor(Math.random()*choices.length)];state.used.push(q.id);return q}

const TEACHER_PASS_KEY='ocaVirtudesDocentePass';
function passwordHash(v){let h=2166136261;const salt='OCA-DOCENTE-2026|';for(const ch of salt+String(v)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,'0')}
function closeAccessModal(){let m=document.querySelector('.access-modal');if(m)m.remove()}
function accessMessage(text,bad=false){let el=document.querySelector('#accessMsg');if(el){el.textContent=text;el.style.color=bad?'#b84b42':'#1e7568'}}
function requestTeacherAccess(target){
  const exists=!!localStorage.getItem(TEACHER_PASS_KEY);
  app.insertAdjacentHTML('beforeend',`<div class="modal-layer access-modal"><section class="modal"><div class="eyebrow">Seguridad docente</div><h2>${exists?'🔐 Ingresar contraseña':'🔑 Crear contraseña docente'}</h2><p>${exists?'Escribe la contraseña docente para continuar.':'Es la primera vez que ingresas. Crea una contraseña de al menos 6 caracteres. Solo quien conozca esta contraseña podrá abrir el modo docente o modificar las casillas.'}</p><label class="field-label">Contraseña</label><input id="teacherPass1" class="name-input" type="password" autocomplete="off" placeholder="Contraseña docente">${exists?'':`<label class="field-label">Repetir contraseña</label><input id="teacherPass2" class="name-input" type="password" autocomplete="off" placeholder="Repite la contraseña">`}<p id="accessMsg" class="file-note"></p><button class="primary" onclick="${exists?`verifyTeacherPassword('${target}')`:`createTeacherPassword('${target}')`}">${exists?'DESBLOQUEAR':'CREAR CONTRASEÑA Y CONTINUAR'}</button><button class="secondary" onclick="closeAccessModal()">CANCELAR</button></section></div>`);
  setTimeout(()=>document.querySelector('#teacherPass1')?.focus(),50)

function createTeacherPassword(target){
  const a=document.querySelector('#teacherPass1')?.value||'',b=document.querySelector('#teacherPass2')?.value||'';
  if(a.length<6){accessMessage('La contraseña debe tener al menos 6 caracteres.',true);return}
  if(a!==b){accessMessage('Las contraseñas no coinciden.',true);return}
  localStorage.setItem(TEACHER_PASS_KEY,passwordHash(a));markProjectSaved();
  closeAccessModal();
  if(target==='teacher')showTeacher();else unlockEditor();
}
function verifyTeacherPassword(target){
  const a=document.querySelector('#teacherPass1')?.value||'';
  if(passwordHash(a)!==localStorage.getItem(TEACHER_PASS_KEY)){accessMessage('Contraseña incorrecta. Inténtalo nuevamente.',true);return}
  closeAccessModal();
  if(target==='teacher')showTeacher();else unlockEditor();
}

const LAST_SAVE_KEY='ocaVirtudesUltimoGuardado';
function markProjectSaved(){localStorage.setItem(LAST_SAVE_KEY,new Date().toISOString())}
function getLastSaveLabel(){
  const v=localStorage.getItem(LAST_SAVE_KEY);
  if(!v)return 'Aún no hay modificaciones guardadas';
  const d=new Date(v);
  if(Number.isNaN(d.getTime()))return 'Guardado';
  return d.toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'});
}

function toggleSound(){state.sound=!state.sound;render()}function restart(){Object.assign(state,{pos:0,points:0,lives:3,correct:0,wrong:0,turns:0,rolling:false,protection:false,used:[],virtues:new Set(),pending:null,previousPos:null,view:'game'});start()}

function saveTile(){let text=document.querySelector('#tileText').value.trim(),url=document.querySelector('#tileUrl').value.trim(),old=state.tileEdits[state.editing]||{};state.tileEdits[state.editing]={text,image:url||old.image||''};localStorage.setItem('ocaVirtudesCasillas',JSON.stringify(state.tileEdits));markProjectSaved();renderEditor()}

function defaultQuestionForTile(n){

  let q=QUESTIONS[(n-2)%QUESTIONS.length];
  return {question:q.pregunta,options:[...q.opciones],correct:q.opciones.indexOf(q.respuestaCorrecta),text:q.explicacion,virtud:q.virtud,categoria:q.categoria};
}
function effectiveTileData(n){
  let saved=state.tileEdits[n]||{}, base=defaultQuestionForTile(n)||{};
  return {...base,...saved,options:(saved.options&&saved.options.some(x=>x))?saved.options:(base.options||['','','',''])};
}
function renderEditor(){let n=state.editing,e=effectiveTileData(n);app.innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><div class="eyebrow">Personalización docente</div><h1>Editor de casillas</h1></div></div><button class="icon-btn" onclick="closeEditor()">← Volver al juego</button></header><section class="editor-layout"><div class="editor-board"><div class="eyebrow">Elige una casilla para editarla</div><div class="editor-grid">${Array.from({length:25},(_,i)=>{let x=i+1,d=effectiveTileData(x);return `<button class="edit-tile ${x===n?'active':''}" onclick="chooseTile(${x})"><b>${x===1?'INICIO':x===25?'META':'Casilla '+x}</b><small>${esc(d.question||d.text||(x===1?'Comienza el camino':x===45?'Llegaste a la meta':'Sin pregunta'))}</small>${d.image?`<img src="${esc(d.image)}" alt="Imagen añadida">`:''}</button>`}).join('')}</div></div><aside class="editor-form"><div class="eyebrow">Casilla ${n}</div><h2>${n===1?'Inicio':n===25?'Meta':'Personaliza esta casilla'}</h2><label class="field-label">Texto visible</label><textarea id="tileText" maxlength="90" placeholder="Ej. Un mensaje de ánimo o una instrucción">${esc(e.text||'')}</textarea><label class="field-label">Imagen por URL</label><input id="tileUrl" class="name-input" value="" placeholder="https://ejemplo.com/imagen.jpg"><button class="primary" onclick="saveTile()">GUARDAR TEXTO / URL</button><p class="file-note">También puedes escoger una imagen de tu equipo. Se guarda solamente en este navegador.</p><input type="file" accept="image/*" onchange="readTileImage(this)"><button class="secondary" onclick="clearTile()">Quitar texto e imagen</button><p class="editor-tip">La imagen se mostrará como fondo suave y el texto aparecerá dentro de la casilla durante la partida.</p></aside></section></div>`}
const renderGame=render;render=function(){if(state.view==='editor'){renderEditor();return}renderGame();let toolbar=document.querySelector('.topbar>div:last-child');if(toolbar)toolbar.insertAdjacentHTML('beforeend','<button class="icon-btn" onclick="openEditor()">🔒 Editar casillas</button>');document.querySelectorAll('.tile').forEach(tile=>{let label=tile.querySelector('.num'),n=Number(label&&label.textContent);if(!Number.isFinite(n))return;let e=state.tileEdits[n];if(!e)return;if(e.image)tile.insertAdjacentHTML('afterbegin',`<img class="tile-image" src="${esc(e.image)}" alt="">`);if(e.text)tile.insertAdjacentHTML('beforeend',`<span class="tile-text">${esc(e.text)}</span>`)} )};
const baseRenderEditor=renderEditor;renderEditor=function(){baseRenderEditor();let e=effectiveTileData(state.editing),form=document.querySelector('.editor-form'),save=form.querySelector('.primary'),opts=e.options||['','','',''],correct=Number.isInteger(e.correct)?e.correct:0;save.insertAdjacentHTML('beforebegin',`<div class="question-editor"><div class="editor-divider"></div><div class="eyebrow">Pregunta establecida para esta casilla</div><p class="file-note"><b>Cada casilla del 2 al 44 ya tiene una pregunta asignada.</b> Puedes verla y modificarla aquí. Tus cambios se guardan automáticamente.</p><label class="field-label">Pregunta</label><textarea id="tileQuestion" maxlength="180" placeholder="Escribe aquí la pregunta para el jugador">${esc(e.question||'')}</textarea><p class="file-note">Escribe cuatro alternativas y marca la respuesta correcta.</p>${opts.map((o,i)=>`<label class="option-edit"><input type="radio" name="correctOption" value="${i}" ${correct===i?'checked':''}><span>${'ABCD'[i]}</span><input class="option-input" id="tileOption${i}" maxlength="110" value="${esc(o)}" placeholder="Opción ${'ABCD'[i]}"></label>`).join('')}</div>`)};
saveTile=function(){let text=document.querySelector('#tileText').value.trim(),url=document.querySelector('#tileUrl').value.trim(),questionText=document.querySelector('#tileQuestion')?.value.trim()||'',options=[0,1,2,3].map(i=>document.querySelector('#tileOption'+i)?.value.trim()||''),selected=document.querySelector('input[name="correctOption"]:checked'),old=effectiveTileData(state.editing);state.tileEdits[state.editing]={text:text||old.text||'',image:url||old.image||'',question:questionText||old.question||'',options:options.some(x=>x)?options:(old.options||['','','','']),correct:selected?Number(selected.value):(Number.isInteger(old.correct)?old.correct:0)};localStorage.setItem('ocaVirtudesCasillas',JSON.stringify(state.tileEdits));markProjectSaved();renderEditor()};
function customQuestionFor(n){let e=effectiveTileData(n);if(!e||!e.question||!Array.isArray(e.options)||e.options.length!==4||e.options.some(o=>!o))return null;return {id:'custom-'+n,categoria:'pregunta personalizada',virtud:'Casilla '+n,pregunta:e.question,opciones:e.options,respuestaCorrecta:e.options[e.correct]||e.options[0],explicacion:e.text||'Esta respuesta fue configurada por el docente.',dificultad:'vivir'}}
const baseLand=land;land=function(){let custom=customQuestionFor(state.pos);if(custom){state.pending=custom;question(custom,'personalizada');return}baseLand()};start();

</script>
